  var main=document.getElementById('mainProductImage');
  var thumbs=Array.prototype.slice.call(document.querySelectorAll('.thumbs img'));
  function selectThumb(img){
    if(!main||!img)return;
    // Intercambia la imagen principal con la miniatura seleccionada.
    // Así nunca se duplica la imagen visible y siempre se puede volver atrás.
    var previousMainSrc = main.src;
    var previousMainAlt = main.alt;
    var selectedSrc = img.src;
    var selectedAlt = img.alt;
    main.style.opacity='.25';
    setTimeout(function(){
      main.src = selectedSrc;
      main.alt = selectedAlt || previousMainAlt;
      img.src = previousMainSrc;
      img.alt = previousMainAlt || selectedAlt;
      main.style.opacity='1';
      thumbs.forEach(function(t){t.classList.remove('active');});
    },90);
  }
  thumbs.forEach(function(img){
    img.addEventListener('click',function(){selectThumb(img)});
    img.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();selectThumb(img)}});
  });
})();
function shareProduct(){
  var btn=document.querySelector('.share');
  var url=window.location.href;
  if(navigator.share){
    navigator.share({title:document.title,url:url}).catch(function(){});
    return;
  }
  navigator.clipboard.writeText(url).then(function(){
    var old=btn.textContent;btn.textContent='✓ Enlace copiado';btn.classList.add('copied');
    setTimeout(function(){btn.textContent=old;btn.classList.remove('copied')},1800);
  }).catch(function(){window.prompt('Copia este enlace:',url)});
}</script>
